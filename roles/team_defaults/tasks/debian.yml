---
# The apt module needs python3-apt to compare packages in check mode. A real
# run installs it on demand; minimal images often lack it.
- name: Check whether python3-apt is available
  ansible.builtin.command: "{{ ansible_facts['python']['executable'] }} -c 'import apt'"
  register: team_defaults_python_apt
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_check_mode

- name: Report that check mode cannot compare apt packages
  ansible.builtin.debug:
    msg: >-
      python3-apt is not installed, so check mode cannot compare apt packages.
      Install it with 'sudo apt install python3-apt' or run without --check.
      Packages that a real run installs: {{ team_defaults_plan.apt | join(', ') }}
  when: ansible_check_mode and team_defaults_python_apt.rc != 0

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ team_defaults_plan.apt }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - team_defaults_plan.apt | length > 0
    - not ansible_check_mode or team_defaults_python_apt.rc == 0

- name: Apply Git settings
  ansible.builtin.include_tasks: git_posix.yml
